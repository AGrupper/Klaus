name: Deploy Klaus to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is REQUIRED for Workload Identity Federation.
# GitHub Actions mints a short-lived OIDC token that Google's WIF pool
# exchanges for temporary GCP credentials — no long-lived service-account
# JSON keys are ever stored in this repository.
permissions:
  contents: read
  id-token: write

jobs:
  # Until 2026-08-15 this workflow shipped without running a single test. The
  # Python and frontend suites both existed and CI ran neither, so a red suite
  # reached production unless someone remembered to run it locally. Deploy now
  # depends on this job, which is the only thing that makes that impossible.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 3.11 matches the production Dockerfile. Never 3.14 — grpc/protobuf
      # native wheels segfault in its garbage collector.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python suite
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend suite
        working-directory: frontend
        run: npm test -- --run

      # The build is part of the gate: Vite/TypeScript errors surface here
      # rather than inside the Docker build after tests have already passed.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest

    # Defining IMAGE here avoids repeating the full tag in every step.
    env:
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/klaus/agent:${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Exchange the GitHub OIDC token for short-lived GCP credentials.
      # The WIF provider is scoped to this exact repo via attribute.repository,
      # so no other repo can impersonate the deployer SA.
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the subtraction boundary
        run: python scripts/check_claude_first_runtime.py

      # A missing GitHub secret interpolates to the empty string, so a renamed
      # secret deploys green and only fails later, at the first MCP call, with
      # "A canonical Klaus user ID is required". That is exactly what happened
      # on 2026-08-13: the secret this reads was renamed, KLAUS_USER_ID silently
      # emptied, and every write and detail call failed for two nights before
      # anyone noticed. Fail here instead — this check costs nothing and the
      # silent version cost days.
      # Guarding only KLAUS_USER_ID moved the next outage to a different key
      # rather than preventing it: CLAUDE_PROJECT_URL was never set as a
      # repository variable, expanded to empty, was dropped from the service,
      # and left the Hub unable to launch the Claude Project. Every value that
      # arrives through a GitHub expression is checked here.
      - name: Verify required secrets and variables resolve
        env:
          KLAUS_USER_ID: ${{ secrets.KLAUS_USER_ID }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CLAUDE_PROJECT_URL: ${{ vars.CLAUDE_PROJECT_URL }}
          CLAUDE_ROUTINE_TRIGGER_URL_MORNING: ${{ vars.CLAUDE_ROUTINE_TRIGGER_URL_MORNING }}
          CLAUDE_ROUTINE_TRIGGER_URL_NIGHTLY: ${{ vars.CLAUDE_ROUTINE_TRIGGER_URL_NIGHTLY }}
          CLAUDE_ROUTINE_TRIGGER_URL_WEEKLY: ${{ vars.CLAUDE_ROUTINE_TRIGGER_URL_WEEKLY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          missing=0
          if [ -z "$KLAUS_USER_ID" ]; then
            echo "::error::KLAUS_USER_ID resolved to empty (secret). Every MCP"
            echo "::error::write and detail call fails at runtime without it."
            missing=1
          fi
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID resolved to empty (secret). Firestore"
            echo "::error::and every store read fall back to the wrong project."
            missing=1
          fi
          if [ -z "$CLAUDE_PROJECT_URL" ]; then
            echo "::error::CLAUDE_PROJECT_URL resolved to empty (variable). The"
            echo "::error::Hub's Ask Claude page cannot launch the project."
            missing=1
          fi
          if [ -z "$CLAUDE_ROUTINE_TRIGGER_URL_MORNING" ]; then
            echo "::error::CLAUDE_ROUTINE_TRIGGER_URL_MORNING resolved to empty"
            echo "::error::(variable). The morning routine cannot be triggered."
            missing=1
          fi
          if [ -z "$CLAUDE_ROUTINE_TRIGGER_URL_NIGHTLY" ]; then
            echo "::error::CLAUDE_ROUTINE_TRIGGER_URL_NIGHTLY resolved to empty"
            echo "::error::(variable). The nightly routine cannot be triggered."
            missing=1
          fi
          if [ -z "$CLAUDE_ROUTINE_TRIGGER_URL_WEEKLY" ]; then
            echo "::error::CLAUDE_ROUTINE_TRIGGER_URL_WEEKLY resolved to empty"
            echo "::error::(variable). The weekly routine cannot be triggered."
            missing=1
          fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID resolved to empty (variable"
            echo "::error::VITE_GOOGLE_CLIENT_ID). Hub sign-in breaks."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing entries in Settings -> Secrets and"
            echo "::error::variables -> Actions, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets and variables resolve."

      # Configures Docker's credential helper so subsequent docker push calls
      # are automatically authenticated against Artifact Registry.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # VITE_GOOGLE_CLIENT_ID is baked into the frontend bundle at build time
      # (the multi-stage Dockerfile accepts it as ARG). It is the public Google
      # OAuth client ID — stored as a GitHub *repository variable*, not a secret.
      # If unset the bundle ships an empty client_id and the hub sign-in button
      # silently fails (USER-SETUP step 3).
      - name: Build Docker image
        run: docker build --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" -t "$IMAGE" .

      - name: Push Docker image to Artifact Registry
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          # --service-account: runs as the runtime SA (datastore.user +
          #   secretmanager.secretAccessor + logging.logWriter).
          #   GOOGLE_APPLICATION_CREDENTIALS is intentionally absent from
          #   --set-env-vars: Cloud Run injects ADC automatically via the
          #   metadata server when a runtime SA is attached.
          #
          # --ingress all: retained Hub, Claude MCP, routine triggers, and
          #   scheduler calls arrive over HTTPS rather than from the VPC.
          #
          # --allow-unauthenticated: required for the retained Hub/MCP
          #   surfaces. Each protected route enforces its own session, shared
          #   secret, or Scheduler OIDC check.
          #
          # --min-instances 0: scale-to-zero — at personal usage volumes the
          #   service is idle most of the time, keeping cost near-zero.
          #
          # --timeout 600: leaves headroom for retained MCP/Routine requests.
          #
          # Worker-count / --concurrency is omitted: the Dockerfile CMD already
          # passes --workers to uvicorn, keeping that concern in one place.
          gcloud run deploy klaus-agent \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --service-account "klaus-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --ingress all \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --set-env-vars "ENVIRONMENT=production,TZ=Asia/Jerusalem,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GOOGLE_TOKEN_STORAGE=secret_manager,GOOGLE_TOKEN_SECRET_NAME=klaus-google-oauth-token,GOOGLE_API_TIMEOUT_SECONDS=30,FIRESTORE_DATABASE=klaus-firestore,KLAUS_USER_ID=${{ secrets.KLAUS_USER_ID }},PINECONE_INDEX_NAME=klaus-memory,KLAUS_EMBEDDING_METER_ENABLED=true,KLAUS_TRAINING_WRITEBACK_ENABLED=true,CLOUD_RUN_URL=https://klaus-agent-y2abtypx4q-zf.a.run.app,KLAUS_PUBLIC_URL=https://klaus-agent-y2abtypx4q-zf.a.run.app,CLAUDE_PROJECT_URL=${{ vars.CLAUDE_PROJECT_URL }},KLAUS_MCP_ENABLED=true,KLAUS_MCP_READ_ONLY_MODE=false,KLAUS_CLAUDE_LIVE_ENABLED=true,KLAUS_CLAUDE_ROUTINES_ENABLED=true,CLAUDE_ROUTINE_TRIGGER_URL_MORNING=${{ vars.CLAUDE_ROUTINE_TRIGGER_URL_MORNING }},CLAUDE_ROUTINE_TRIGGER_URL_NIGHTLY=${{ vars.CLAUDE_ROUTINE_TRIGGER_URL_NIGHTLY }},CLAUDE_ROUTINE_TRIGGER_URL_WEEKLY=${{ vars.CLAUDE_ROUTINE_TRIGGER_URL_WEEKLY }},KLAUS_CAPABILITY_MCP_VERIFIED=true,KLAUS_CAPABILITY_SKILL_VERIFIED=true,KLAUS_CAPABILITY_ROUTINE_VERIFIED=true,KLAUS_CAPABILITY_PUBLISH_VERIFIED=true,KLAUS_ROUTINE_MORNING_CUTOVER=true,KLAUS_ROUTINE_NIGHTLY_CUTOVER=true,KLAUS_ROUTINE_WEEKLY_CUTOVER=true,KLAUS_DETERMINISTIC_ALERTS_ENABLED=true,CLOUD_SCHEDULER_SA_EMAIL=klaus-heartbeat@klaus-agent.iam.gserviceaccount.com,CLOUD_TASKS_QUEUE=klaus-updates,CLOUD_TASKS_LOCATION=me-central1,GOOGLE_OAUTH_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }},VAPID_PUBLIC_KEY=BP-LvQ0tHd1EOnZOqknpOfIVLVNi1bM_iKzI0MhbpuKWR-SW2Boldv5gnM6wmfuYD-YbeBQfbKeyo5plAYl6EH0,TASK_BACKEND=things,THINGS_WRITE_ENABLED=true" \
            --set-secrets "GEMINI_EMBEDDING_API_KEY=klaus-gemini-embedding-key:latest,PINECONE_API_KEY=klaus-pinecone-key:latest,GARMIN_EMAIL=klaus-garmin-email:latest,GARMIN_PASSWORD=klaus-garmin-password:latest,HOME_ADDRESS=klaus-home-address:latest,PG_CONNECTION_STRING=klaus-postgres-connection-string:latest,HEALTHKIT_WEBHOOK_TOKEN=klaus-healthkit-webhook-token:latest,HEVY_API_KEY=klaus-hevy-api-key:latest,NIGHTLY_TRIGGER_TOKEN=klaus-nightly-trigger-token:latest,MORNING_TRIGGER_TOKEN=klaus-morning-trigger-token:latest,HUB_SESSION_SECRET=klaus-hub-session-secret:latest,CLAUDE_ROUTINE_TRIGGER_TOKEN_MORNING=klaus-claude-routine-morning-token:latest,CLAUDE_ROUTINE_TRIGGER_TOKEN_NIGHTLY=klaus-claude-routine-nightly-token:latest,CLAUDE_ROUTINE_TRIGGER_TOKEN_WEEKLY=klaus-claude-routine-weekly-token:latest,THINGS_EMAIL=klaus-things-email:latest,THINGS_PASSWORD=klaus-things-password:latest" \
            --quiet

      # Fetch the live URL and hit /health to confirm the new revision is
      # serving traffic before the workflow reports success.
      # --quiet suppresses verbose gcloud output; the curl exit code confirms success.
      - name: Smoke-test health endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe klaus-agent \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format 'value(status.url)')
          echo "Service URL: ${SERVICE_URL}"
          curl --fail --silent --show-error "${SERVICE_URL}/health"
